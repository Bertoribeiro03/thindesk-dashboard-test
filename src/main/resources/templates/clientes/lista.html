<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Clientes', 'clientes', ~{::content}, ~{::scripts})}">
<body><div th:fragment="content">
  <header class="management-heading"><div><p class="eyebrow">CADASTROS</p><h1>Clientes</h1><p class="subtitle">Contatos e setores atendidos pela equipe.</p></div><a class="button" th:href="@{/clientes/novo}">+ Novo cliente</a></header>
  <div th:replace="~{fragments/messages :: success}"></div>
  <section class="panel cadastro-table"><div class="table-scroll"><table><thead><tr><th>Nome</th><th>Telefone</th><th>Setor</th><th>Ações</th></tr></thead><tbody>
    <tr th:each="cliente : ${clientes}"><td th:text="${cliente.nome}"></td><td th:text="${cliente.telefone}"></td><td th:text="${cliente.setor}"></td><td><div class="row-actions"><a class="button secondary small" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a><form th:action="@{/clientes/deletar/{id}(id=${cliente.id})}" method="post"><button class="secondary danger small" type="submit">Excluir</button></form></div></td></tr>
    <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="4" class="table-placeholder">Nenhum cliente cadastrado.</td></tr>
  </tbody></table></div></section>
</div><th:block th:fragment="scripts"></th:block></body></html>
