<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Chamados', 'chamados', ~{::content}, ~{::scripts})}">
<body><div th:fragment="content">
  <header class="management-heading"><div><p class="eyebrow">ATENDIMENTO</p><h1>Chamados técnicos</h1><p class="subtitle">Acompanhe o status e as considerações de cada atendimento.</p></div><a class="button" th:href="@{/chamados/novo}">+ Novo chamado</a></header>
  <div th:replace="~{fragments/messages :: success}"></div>
  <section class="panel"><div class="table-scroll"><table><thead><tr><th>#</th><th>Descrição</th><th>Status</th><th>Tipo</th><th>Técnico</th><th>Usuário</th><th>Considerações técnicas</th><th>Ações</th></tr></thead><tbody>
    <tr th:each="chamado : ${chamados}"><td th:text="${chamado.id}"></td><td th:text="${chamado.descricao}"></td><td><span class="status" th:classappend="${chamado.status}" th:text="${statusLabels[chamado.status]}"></span></td><td th:text="${chamado.tipo}"></td><td th:text="${chamado.tecnico ?: '—'}"></td><td th:text="${chamado.usuario ?: '—'}"></td><td th:text="${chamado.consideracoesTecnicas ?: '—'}"></td><td><div class="row-actions"><a class="button secondary small" th:href="@{/chamados/atualizar/{id}(id=${chamado.id})}">Editar</a><form th:if="${chamado.status != 'cancelado'}" th:action="@{/chamados/cancelar/{id}(id=${chamado.id})}" method="post"><button class="secondary danger small" type="submit">Cancelar</button></form></div></td></tr>
    <tr th:if="${#lists.isEmpty(chamados)}"><td colspan="8" class="table-placeholder">Nenhum chamado cadastrado.</td></tr>
  </tbody></table></div><div class="pagination"><span th:text="|Página ${page} de ${pages} · ${total} chamados|"></span><div><a class="button secondary small" th:if="${page > 1}" th:href="@{/chamados(page=${page - 1})}">‹ Anterior</a><a class="button secondary small" th:if="${page < pages}" th:href="@{/chamados(page=${page + 1})}">Próxima ›</a></div></div></section>
</div><th:block th:fragment="scripts"></th:block></body></html>
