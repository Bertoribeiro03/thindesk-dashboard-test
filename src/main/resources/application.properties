spring.application.name=thindesk
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:}
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.web.resources.cache.period=3600
thindesk.db-path=${THINDESK_DB_PATH:api/data/thindesk.db}
thindesk.data-source=${THINDESK_DATA_SOURCE:local_sqlite}
thindesk.initialize=${THINDESK_INITIALIZE:true}
thindesk.seed=${THINDESK_SEED_EXAMPLE:false}
thindesk.security-enabled=${THINDESK_SECURITY_ENABLED:false}
thindesk.username=${THINDESK_USERNAME:}
thindesk.password=${THINDESK_PASSWORD:}
